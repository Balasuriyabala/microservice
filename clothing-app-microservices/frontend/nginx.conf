events {}

http {
  server {
    listen 80;

    # Serve static frontend
    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    # API Gateway-style reverse proxy
    location /api/users {
      proxy_pass http://user-service:5000/users;
    }
    location /api/products {
      proxy_pass http://product-service:6000/products;
    }
    location /api/orders {
      proxy_pass http://order-service:7000/orders;
    }
  }
}
